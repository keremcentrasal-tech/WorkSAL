<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı | CentraSAL</title><meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>:root{--blue:#0a9dff;--cyan:#5ee7ff}*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:#000;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;animation:i .7s}@keyframes i{from{opacity:0;transform:translateY(8px)}}
h1{font-size:clamp(84px,22vw,180px);letter-spacing:-.05em;line-height:1;background:linear-gradient(135deg,var(--cyan),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:#86868b;font-size:18px;margin:12px 0 32px}a{display:inline-block;padding:13px 26px;border-radius:980px;background:var(--blue);color:#fff;text-decoration:none;font-weight:500;transition:transform .25s,box-shadow .25s}a:hover{transform:scale(1.05);box-shadow:0 8px 40px rgba(10,157,255,.45)}</style></head>
<body><h1>404</h1><p>Aradığınız sayfa bulunamadı.</p><a href="/">Ana sayfaya dön</a></body></html>
